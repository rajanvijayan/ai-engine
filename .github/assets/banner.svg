<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="AI Engine: one PHP API for every major AI model">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226"/>
      <stop offset="0.55" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#3a1d5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b9cff"/>
      <stop offset="1" stop-color="#d38bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>

  <!-- Network motif: one engine hub fanning out to many models -->
  <g transform="translate(1130 160) scale(0.8)" stroke="url(#accent)" stroke-width="2" fill="none" stroke-opacity="0.7">
    <line x1="0" y1="0" x2="-110" y2="-80"/>
    <line x1="0" y1="0" x2="-130" y2="10"/>
    <line x1="0" y1="0" x2="-95" y2="95"/>
    <line x1="0" y1="0" x2="20" y2="-115"/>
    <line x1="0" y1="0" x2="115" y2="-60"/>
    <line x1="0" y1="0" x2="125" y2="45"/>
    <line x1="0" y1="0" x2="40" y2="115"/>
  </g>
  <g transform="translate(1130 160) scale(0.8)" fill="#dfe4ff">
    <circle cx="-110" cy="-80" r="9"/>
    <circle cx="-130" cy="10" r="7"/>
    <circle cx="-95" cy="95" r="8"/>
    <circle cx="20" cy="-115" r="7"/>
    <circle cx="115" cy="-60" r="9"/>
    <circle cx="125" cy="45" r="7"/>
    <circle cx="40" cy="115" r="8"/>
    <circle r="38" fill="url(#accent)"/>
    <text y="10" text-anchor="middle" fill="#0f1226" font-size="28" font-weight="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">AI</text>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="104" fill="url(#accent)" font-size="20" font-weight="600" letter-spacing="3">PHP · COMPOSER PACKAGE</text>
    <text x="94" y="166" fill="#ffffff" font-size="64" font-weight="800">AI Engine</text>
    <text x="96" y="200" fill="#b8bfe6" font-size="24">One PHP API for every major AI model</text>
    <g transform="translate(96 222)"><rect width="99" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#8b9cff" stroke-opacity="0.45"/><text x="49.5" y="25" text-anchor="middle" fill="#dfe4ff" font-size="17" font-weight="500">OpenAI</text></g>
    <g transform="translate(207 222)"><rect width="99" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#8b9cff" stroke-opacity="0.45"/><text x="49.5" y="25" text-anchor="middle" fill="#dfe4ff" font-size="17" font-weight="500">Claude</text></g>
    <g transform="translate(318 222)"><rect width="99" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#8b9cff" stroke-opacity="0.45"/><text x="49.5" y="25" text-anchor="middle" fill="#dfe4ff" font-size="17" font-weight="500">Gemini</text></g>
    <g transform="translate(429 222)"><rect width="78" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#8b9cff" stroke-opacity="0.45"/><text x="39.0" y="25" text-anchor="middle" fill="#dfe4ff" font-size="17" font-weight="500">Grok</text></g>
    <g transform="translate(519 222)"><rect width="120" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#8b9cff" stroke-opacity="0.45"/><text x="60.0" y="25" text-anchor="middle" fill="#dfe4ff" font-size="17" font-weight="500">DeepSeek</text></g>
    <g transform="translate(651 222)"><rect width="109" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#8b9cff" stroke-opacity="0.45"/><text x="54.5" y="25" text-anchor="middle" fill="#dfe4ff" font-size="17" font-weight="500">Mistral</text></g>
    <g transform="translate(772 222)"><rect width="78" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#8b9cff" stroke-opacity="0.45"/><text x="39.0" y="25" text-anchor="middle" fill="#dfe4ff" font-size="17" font-weight="500">Groq</text></g>
    <g transform="translate(862 222)"><rect width="88" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#8b9cff" stroke-opacity="0.45"/><text x="44.0" y="25" text-anchor="middle" fill="#dfe4ff" font-size="17" font-weight="500">Llama</text></g>
  </g>
</svg>
