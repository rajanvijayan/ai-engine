name: Changelog Check

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  changelog:
    name: Verify Changelog Updated
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR has skip-changelog label
        id: check-label
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}" == "true" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping changelog check due to 'skip-changelog' label"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for CHANGELOG.md changes
        if: steps.check-label.outputs.skip != 'true'
        run: |
          # Get the base branch
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          
          echo "Comparing against origin/$BASE_BRANCH..."
          
          # Check if CHANGELOG.md was modified in this PR
          if git diff --name-only origin/$BASE_BRANCH...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "✅ CHANGELOG.md has been updated!"
            echo "::notice::CHANGELOG.md was updated in this PR"
          else
            echo "❌ CHANGELOG.md has NOT been updated!"
            echo ""
            echo "Please update CHANGELOG.md with your changes under the [Unreleased] section."
            echo ""
            echo "If this change doesn't require a changelog entry (e.g., docs-only, CI changes),"
            echo "add the 'skip-changelog' label to this PR."
            echo ""
            echo "::error::CHANGELOG.md must be updated before merging. Add 'skip-changelog' label to skip this check."
            exit 1
          fi

      - name: Validate CHANGELOG format
        if: steps.check-label.outputs.skip != 'true'
        run: |
          if [ -f "CHANGELOG.md" ]; then
            echo "Validating CHANGELOG.md format..."
            
            # Check for required sections
            if grep -q "## \[Unreleased\]" CHANGELOG.md; then
              echo "✅ [Unreleased] section found"
            else
              echo "⚠️ Warning: [Unreleased] section not found in CHANGELOG.md"
            fi
            
            # Check for Keep a Changelog format
            if grep -q "### Added\|### Changed\|### Deprecated\|### Removed\|### Fixed\|### Security" CHANGELOG.md; then
              echo "✅ Standard changelog sections found"
            else
              echo "⚠️ Warning: Consider using standard sections (Added, Changed, Deprecated, Removed, Fixed, Security)"
            fi
            
            echo "::notice::CHANGELOG.md format validation complete"
          else
            echo "::error::CHANGELOG.md file not found!"
            exit 1
          fi

